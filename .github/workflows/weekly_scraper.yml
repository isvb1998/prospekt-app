name: Weekly Prospekt Scraper (PLZ 10369)

on:
  schedule:
    # Runs every Sunday at midnight (00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual run trigger from GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper Script
        run: |
          python scraper.py

      - name: Commit and Push Updated SQLite Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prospekt_optimizer.db
          git commit -m "Auto-update weekly offer database (PLZ 10369)" || exit 0
          git push
